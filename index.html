<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dakk - P2P Güvenli Sohbet Daveti</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0E1013;
            color: white;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .card {
            background-color: #171A21;
            border: 1px solid #232833;
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-wrap {
            width: 88px;
            height: 88px;
            background: white;
            border-radius: 50%;
            padding: 6px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(255,193,7,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        h1 {
            color: #FFC107;
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 800;
        }
        .subtitle {
            color: #8E95A5;
            margin: 0 0 24px 0;
            font-size: 14px;
            line-height: 1.5;
        }
        .security-badge {
            background-color: #0E1013;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            color: #4CAF50;
            margin-bottom: 24px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            display: block;
            margin-bottom: 12px;
            transition: transform 0.15s, opacity 0.15s;
        }
        .btn-primary {
            background-color: #FFC107;
            color: #000;
        }
        .btn-secondary {
            background-color: #232833;
            color: #FFF;
        }
        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
        #status {
            font-size: 13px;
            color: #FFC107;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="https://raw.githubusercontent.com/cnrcrm20-ctrl/Dakk/main/app/src/main/res/drawable/dakk_logo.png" alt="Dakk">
        </div>
        <h1>Dakk P2P Daveti 🐥</h1>
        <p class="subtitle">Arkadaşınız sizinle tamamen uçtan uca şifreli ve sunucusuz (0 TL maliyet) doğrudan sohbet başlatmak istiyor.</p>
        
        <div class="security-badge">
            🛡️ Uçtan Uca Şifreli • Sıfır Sunucu • %100 Mahremiyet
        </div>

        <a id="btn-open-app" href="#" class="btn btn-primary">Dakk Uygulamasında Aç 🚀</a>
        <a href="https://github.com/cnrcrm20-ctrl/Dakk/releases/latest/download/Dakk.apk" class="btn btn-secondary">Dakk APK İndir (En Son Sürüm)</a>
        
        <p id="status">Dakk uygulaması açılmaya çalışılıyor...</p>
    </div>

    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const data = getQueryParam('data');
        const inviteSchemeUrl = data ? `dakk://invite?data=${encodeURIComponent(data)}` : `dakk://invite`;
        const openBtn = document.getElementById('btn-open-app');
        openBtn.href = inviteSchemeUrl;

        if (data) {
            // Uygulamayı açmayı otomatik dene
            window.location.href = inviteSchemeUrl;

            setTimeout(() => {
                document.getElementById('status').innerText = "Dakk yüklü değilse yukarıdaki butondan indirebilirsiniz. Vak vak!";
            }, 2000);
        } else {
            document.getElementById('status').innerText = "Bağlantıda davet parametresi bulunamadı.";
        }
    </script>
</body>
</html>
