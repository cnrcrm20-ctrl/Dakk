<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dakk daveti</title>
<meta name="description" content="Dakk'ta seninle yazışmak isteyen biri var. Uygulamayı aç veya indir.">
<meta name="theme-color" content="#090A0D">
<meta name="robots" content="noindex">
<link rel="icon" href="../logo.png">
<meta property="og:title" content="Dakk'ta sohbete davet edildin">
<meta property="og:description" content="Uçtan uca şifreli mesajlaşma. Daveti açmak için dokun.">
<meta property="og:image" content="https://cnrcrm20-ctrl.github.io/Dakk/logo.png">
</head>
<body style="margin:0;background:#090A0D;color:#ECECEC;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;">
<div style="max-width:460px;margin:0 auto;padding:56px 22px;text-align:center;">
  <img src="../logo.png" alt="Dakk" width="96" height="96" style="border-radius:24px;">
  <h1 style="font-size:28px;margin:18px 0 8px;color:#FFFFFF;">Dakk'ta sohbete davet edildin</h1>
  <p id="lead" style="margin:0 0 28px;color:#BDBDBD;">Daveti açmak için Dakk uygulamasını kullan. Uygulama yüklü değilse önce indir.</p>

  <a id="open" href="#"
     style="display:block;background:#FFC107;color:#111;font-weight:700;font-size:17px;padding:14px 20px;border-radius:999px;text-decoration:none;margin-bottom:12px;">
    Dakk'ta aç
  </a>
  <a id="download" href="https://github.com/cnrcrm20-ctrl/Dakk/releases/latest"
     style="display:block;background:#1E2128;color:#FFFFFF;font-weight:600;font-size:16px;padding:13px 20px;border-radius:999px;text-decoration:none;">
    Dakk'ı indir (Android)
  </a>

  <div id="manual" style="display:none;margin-top:28px;background:#15171C;border-radius:16px;padding:16px;text-align:left;">
    <div style="color:#A8A8A8;font-size:14px;margin-bottom:6px;">Uygulama açılmazsa: Dakk → <b>Kişi ekle</b> ekranına bu kimliği yapıştır:</div>
    <code id="uid" style="display:block;word-break:break-all;color:#FFC107;font-size:14px;"></code>
    <button id="copy" type="button"
      style="margin-top:10px;background:none;border:1px solid #3A3D45;color:#ECECEC;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;">
      Kopyala
    </button>
  </div>

  <p style="margin-top:36px;color:#6F6F6F;font-size:13px;">
    Dakk, uçtan uca şifreli ücretsiz bir mesajlaşma uygulamasıdır.
    <a href="../" style="color:#BDBDBD;">Daha fazla bilgi</a>
  </p>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var uid = (params.get('u') || params.get('uid') || '').trim();
  var valid = /^[A-Za-z0-9]{20,128}$/.test(uid);
  var open = document.getElementById('open');

  if (!valid) {
    document.getElementById('lead').textContent =
      'Bu davet bağlantısı eksik veya hatalı görünüyor. Arkadaşından yeni bir bağlantı isteyebilir ya da Dakk\'ı indirip QR kodla ekleyebilirsin.';
    open.style.display = 'none';
    return;
  }

  var releases = 'https://github.com/cnrcrm20-ctrl/Dakk/releases/latest';
  var isAndroid = /android/i.test(navigator.userAgent);
  var appLink = isAndroid
    ? 'intent://add?u=' + uid + '#Intent;scheme=dakk;package=dakk.android.co;S.browser_fallback_url=' + encodeURIComponent(releases) + ';end'
    : 'dakk://add?u=' + uid;
  open.href = appLink;

  document.getElementById('uid').textContent = uid;
  document.getElementById('manual').style.display = 'block';
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    (navigator.clipboard ? navigator.clipboard.writeText(uid) : Promise.reject())
      .then(function () { btn.textContent = 'Kopyalandı ✓'; })
      .catch(function () { btn.textContent = 'Kopyalanamadı'; });
  });

  // Doğrudan APK bağlantısı
  fetch('https://api.github.com/repos/cnrcrm20-ctrl/Dakk/releases/latest')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (rel) {
      var apk = rel && (rel.assets || []).find(function (a) { return /\.apk$/i.test(a.name); });
      if (apk) document.getElementById('download').href = apk.browser_download_url;
    })
    .catch(function () {});

  // Android'de uygulamayı otomatik açmayı dene
  if (isAndroid) setTimeout(function () { location.href = appLink; }, 400);
})();
</script>
</body>
</html>
