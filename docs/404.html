<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — Dakk</title>
<meta name="theme-color" content="#090A0D">
<meta name="robots" content="noindex">
<link rel="icon" href="/Dakk/logo.png">
</head>
<body style="margin:0;background:#090A0D;color:#ECECEC;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
<div style="max-width:460px;margin:0 auto;padding:80px 22px;text-align:center;">
  <img src="/Dakk/logo.png" alt="Dakk" width="88" height="88" style="border-radius:22px;">
  <h1 style="font-size:64px;margin:16px 0 0;color:#FFC107;">404</h1>
  <p style="font-size:18px;color:#BDBDBD;margin:8px 0 28px;">Aradığın sayfa bulunamadı.</p>
  <a href="/Dakk/"
     style="display:inline-block;background:#FFC107;color:#111;font-weight:700;padding:12px 26px;border-radius:999px;text-decoration:none;">
    Ana sayfaya dön
  </a>
</div>
<script>
  // Eski veya hatalı davet bağlantılarını (ör. /Dakk/invite?u=...) davet sayfasına yönlendir
  if (/\/invite/i.test(location.pathname) && location.search) {
    location.replace('/Dakk/invite/' + location.search);
  }
</script>
</body>
</html>
